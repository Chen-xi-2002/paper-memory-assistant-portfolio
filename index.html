<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="本地优先的论文记忆、检索与引用助手">
  <title>文脉 · 论文记忆助手</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell" id="app">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M8 9.5C8 7.57 9.57 6 11.5 6H31v24H11.5A3.5 3.5 0 0 0 8 33.5v-24Z" fill="currentColor"/>
            <path d="M8 33.5A3.5 3.5 0 0 1 11.5 30H31v4H11.5A3.5 3.5 0 0 1 8 33.5Z" fill="#D7A86E"/>
            <path d="M14 13h11M14 18h8" stroke="#F8F4EC" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <strong>文脉</strong>
          <span>论文记忆助手</span>
        </div>
        <button class="icon-button sidebar-close" id="sidebarClose" type="button" aria-label="关闭导航">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <button class="btn btn-primary new-chat-button" id="newChatButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        新对话
      </button>

      <nav class="primary-nav" aria-label="功能">
        <button class="nav-item active" type="button" data-view="chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-8a8 8 0 1 1 18-3Z"/></svg>
          <span>问我读过什么</span>
          <span class="nav-count" id="chatCount">0</span>
        </button>
        <button class="nav-item" type="button" data-view="library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
          <span>我的文献库</span>
          <span class="nav-count" id="paperCount">0</span>
        </button>
      </nav>

      <section class="sidebar-section recent-section">
        <div class="section-label">
          <span>最近对话</span>
          <button class="text-button" id="clearChatsButton" type="button">清空</button>
        </div>
        <div class="recent-list" id="recentList"></div>
      </section>

      <section class="sidebar-section tag-section">
        <div class="section-label"><span>我的主题</span></div>
        <div class="tag-cloud" id="sidebarTags"></div>
      </section>

      <div class="sidebar-footer">
        <button class="sidebar-action" id="importTopButton" type="button">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
          </span>
          <span><strong>导入论文</strong><small>PDF、文本或 JSON</small></span>
        </button>
        <button class="sidebar-action" id="exportButton" type="button">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg>
          </span>
          <span><strong>导出资料</strong><small>备份全部论文与笔记</small></span>
        </button>
      </div>
    </aside>

    <div class="mobile-scrim" id="mobileScrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" type="button" aria-label="打开导航">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="page-title">
          <span class="eyebrow">我的论文记忆</span>
          <h1 id="viewTitle">问我读过什么</h1>
        </div>
        <div class="topbar-actions">
          <span class="local-badge">
            <span class="status-dot"></span>
            本地存储
          </span>
          <button class="icon-button" id="asideToggle" type="button" aria-label="显示引用信息">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM15 5v14"/></svg>
          </button>
        </div>
      </header>

      <section class="view chat-view active" id="chatView" aria-label="论文问答">
        <div class="chat-scroll" id="chatScroll">
          <div class="messages" id="messages"></div>
        </div>

        <div class="composer-wrap">
          <div class="quick-prompts" id="quickPrompts">
            <button type="button" data-prompt="二语语言经验在二语语音感知中有多重要？">二语经验与语音感知</button>
            <button type="button" data-prompt="哪些论文讨论了轻重音或词汇重音？">查找轻重音论文</button>
            <button type="button" data-prompt="母语经验如何影响非母语语音加工？">母语迁移的论文依据</button>
            <button type="button" data-prompt="帮我搜索跟婴儿感知韵律有关的论文">全网找：婴儿韵律感知</button>
          </div>
          <form class="composer" id="chatForm">
            <textarea id="chatInput" rows="1" placeholder="例如：帮我搜索“婴儿感知韵律”的论文，或询问已导入论文" aria-label="向论文库提问"></textarea>
            <div class="composer-footer">
              <div class="search-mode" role="group" aria-label="检索范围">
                <button type="button" data-search-mode="local">仅文献库</button>
                <button class="active" type="button" data-search-mode="smart">智能联网</button>
              </div>
              <span class="composer-hint">先查你的资料；需要时再检索 OpenAlex / Crossref</span>
              <button class="send-button" id="sendButton" type="submit" aria-label="发送">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="m12 13 7-8"/></svg>
              </button>
            </div>
          </form>
          <p class="search-note">回答会区分“本地全文 / 笔记”“在线摘要 / 元数据”和“待补 PDF”的来源层级。</p>
        </div>
      </section>

      <section class="view library-view" id="libraryView" aria-label="文献库" hidden>
        <div class="library-toolbar">
          <label class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="librarySearch" type="search" placeholder="搜索标题、作者、主题或笔记">
          </label>
          <button class="btn btn-primary" id="importButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            导入论文
          </button>
        </div>
        <div class="library-summary" id="librarySummary"></div>
        <div class="paper-grid" id="paperGrid"></div>
      </section>
    </main>

    <aside class="aside" id="aside" aria-label="引用与文献概览">
      <div class="aside-head">
        <div>
          <span class="eyebrow">当前对话</span>
          <h2>引用依据</h2>
        </div>
        <button class="icon-button aside-close" id="asideClose" type="button" aria-label="关闭引用信息">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="citation-panel" id="citationPanel"></div>
      <div class="aside-divider"></div>
      <div class="coverage-panel">
        <div class="aside-section-title">
          <span>文献库概览</span>
          <button class="text-button" id="viewLibraryButton" type="button">查看全部</button>
        </div>
        <div class="coverage-stats" id="coverageStats"></div>
        <div class="coverage-tags" id="coverageTags"></div>
      </div>
      <div class="aside-footer">
        <button class="btn btn-secondary btn-block" id="importSideButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
          添加论文或笔记
        </button>
      </div>
    </aside>
  </div>

  <div class="modal-backdrop" id="importModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <header class="modal-head">
        <div>
          <span class="eyebrow">建立可检索的记忆</span>
          <h2 id="importTitle">导入一篇论文</h2>
        </div>
        <button class="icon-button" id="closeImportButton" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="import-tabs" role="tablist">
        <button class="import-tab active" type="button" role="tab" aria-selected="true" data-import-tab="pdf">PDF / 文本</button>
        <button class="import-tab" type="button" role="tab" aria-selected="false" data-import-tab="manual">手动录入</button>
        <button class="import-tab" type="button" role="tab" aria-selected="false" data-import-tab="json">批量 JSON</button>
      </div>

      <div class="modal-body">
        <div class="import-pane active" id="importPanePdf">
          <label class="dropzone" id="dropzone">
            <input type="file" id="paperFileInput" accept=".pdf,.txt,.md,.json" multiple>
            <span class="dropzone-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 15v5h14v-5"/></svg>
            </span>
            <strong>把论文拖到这里，或点击选择</strong>
            <span>支持 PDF、TXT、Markdown；文本会保存在本机浏览器中</span>
          </label>
          <div class="extract-status" id="extractStatus" aria-live="polite"></div>
          <div class="import-tip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"/><path d="M12 16v-4M12 8h.01"/></svg>
            <p>PDF 导入会自动提取可复制文字；扫描版 PDF 需要 OCR，暂不能直接识别。导入后可继续补充作者、年份和自己的笔记。</p>
          </div>
        </div>

        <form class="import-pane" id="importPaneManual">
          <div class="form-grid">
            <label class="form-field span-2">
              <span>论文标题 *</span>
              <input id="manualTitle" name="title" required placeholder="例：Perceiving vowels in a second language">
            </label>
            <label class="form-field">
              <span>作者</span>
              <input id="manualAuthors" name="authors" placeholder="多位作者用逗号分隔">
            </label>
            <label class="form-field">
              <span>年份</span>
              <input id="manualYear" name="year" inputmode="numeric" placeholder="2024">
            </label>
            <label class="form-field span-2">
              <span>期刊 / 会议 / 出版社</span>
              <input id="manualVenue" name="venue" placeholder="例：Journal of Phonetics">
            </label>
            <label class="form-field span-2">
              <span>DOI / 链接</span>
              <input id="manualDoi" name="doi" placeholder="https://doi.org/...">
            </label>
            <label class="form-field span-2">
              <span>主题标签</span>
              <input id="manualTags" name="tags" placeholder="二语语音, 语言经验, 感知；用逗号分隔">
            </label>
            <label class="form-field span-2">
              <span>摘要 / 文章概要</span>
              <textarea id="manualAbstract" rows="4" placeholder="粘贴摘要，或用自己的话概括研究问题、方法和结论"></textarea>
            </label>
            <label class="form-field span-2">
              <span>读后笔记</span>
              <textarea id="manualNote" rows="4" placeholder="你真正想记住的是什么？建议写：结论、证据、局限、可用于论文的哪一段"></textarea>
            </label>
            <label class="form-field span-2">
              <span>关键证据片段</span>
              <textarea id="manualEvidence" rows="4" placeholder="粘贴原文，或写下这条证据支持/反驳的观点"></textarea>
            </label>
            <label class="form-field">
              <span>页码 / 章节</span>
              <input id="manualPage" name="page" placeholder="例：p. 12, Results">
            </label>
            <label class="form-field">
              <span>证据标签</span>
              <input id="manualEvidenceTags" name="evidenceTags" placeholder="例：支持, 语言经验">
            </label>
            <label class="form-field span-2">
              <span>论文正文（可选）</span>
              <textarea id="manualFullText" rows="6" placeholder="粘贴论文全文，之后可以全文检索。也可以稍后通过 PDF 导入。"></textarea>
            </label>
          </div>
          <div class="modal-actions">
            <button class="btn btn-secondary" type="button" id="clearManualForm">清空</button>
            <button class="btn btn-primary" type="submit">保存到文献库</button>
          </div>
        </form>

        <div class="import-pane" id="importPaneJson">
          <div class="json-actions">
            <label class="dropzone compact">
              <input type="file" id="jsonFileInput" accept=".json">
              <span class="dropzone-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 15v5h14v-5"/></svg>
              </span>
              <strong>选择导出的 JSON 文件</strong>
              <span>会合并论文并跳过重复条目</span>
            </label>
            <button class="btn btn-secondary" type="button" id="downloadJsonButton">下载当前文献库</button>
          </div>
          <label class="form-field json-paste">
            <span>或直接粘贴 JSON</span>
            <textarea id="jsonPaste" rows="14" placeholder='{"papers": [...]}'></textarea>
          </label>
          <div class="modal-actions">
            <button class="btn btn-primary" type="button" id="importPastedJson">导入 JSON</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="reviewModal" hidden>
    <section class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
      <header class="modal-head">
        <div>
          <span class="eyebrow">逐条核对来源</span>
          <h2 id="reviewTitle">导入结果</h2>
        </div>
        <button class="icon-button" id="closeReviewButton" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="modal-body review-body" id="reviewBody"></div>
    </section>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="paper-drawer" id="paperDrawer" aria-label="论文详情" hidden>
    <div class="drawer-head">
      <span class="eyebrow">论文详情</span>
      <button class="icon-button" id="closeDrawerButton" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer-content" id="drawerContent"></div>
  </aside>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
